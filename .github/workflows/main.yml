name: Deploy Flask App to Touge Server
on:
  push:
    branches:
      - main
  workflow_dispatch:  # ✅ 加上这个！！就会出现【Run workflow】手动运行按钮
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false
      - name: Deploy to Touge via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOUGE_HOST }}
          port: ${{ secrets.TOUGE_PORT }}
          username: ${{ secrets.TOUGE_USER }}
          key: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          script: |
            cd /root/myflaskapp
            git pull origin main
            pip install -r requirements.txt
            systemctl restart flask
